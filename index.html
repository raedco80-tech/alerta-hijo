<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta de Emergencia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 { margin-top: 0; color: #d9534f; animation: parpadeo 1s infinite; }
        @keyframes parpadeo {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .data-box {
            text-align: left;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 5px solid #d9534f;
        }
        .data-box p { margin: 8px 0; font-size: 15px; }
        .btn-llamada {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            width: 80%;
        }
        .btn-alarma {
            background-color: #dc3545;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            width: 90%;
        }
        .btn-gps {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 90%;
        }
        #estado-gps { margin-top: 8px; font-size: 13px; color: #666; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚠️ ALERTA DE EMERGENCIA</h2>
        <p>Información médica y de contacto vital:</p>
        
        <div class="data-box">
            <p><strong>Nombre:</strong> <span id="lbl-nombre">Cargando...</span></p>
            <p><strong>Tipo de Sangre:</strong> <span id="lbl-sangre">-</span></p>
            <p><strong>Condición:</strong> <span id="lbl-condicion">-</span></p>
            <p><strong>Alergias:</strong> <span id="lbl-alergias">-</span></p>
            <p><strong>Notas:</strong> <span id="lbl-notas">-</span></p>
        </div>

        <!-- Botón de alarma sonora garantizada -->
        <button class="btn-alarma" onclick="sonarAlarma()">🚨 ACTIVAR ALARMA SONORA</button>

        <!-- Botón de llamada rápida -->
        <a id="btn-llamar" href="#" class="btn-llamada">📞 LLAMAR A CONTACTO</a>

        <!-- Botón de Ubicación GPS Exacta -->
        <button class="btn-gps" onclick="obtenerUbicacionGPS()">📍 Ver Ubicación GPS Exacta</button>
        <p id="estado-gps"></p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        const nombre = params.get('nombre') || 'No especificado';
        const tel = params.get('tel') || '#';
        const sangre = params.get('sangre') || 'No especificado';
        const condicion = params.get('condicion') || 'Ninguna';
        const alergias = params.get('alergias') || 'Ninguna';
        const notas = params.get('notas') || 'Ninguna';

        document.getElementById('lbl-nombre').innerText = nombre;
        document.getElementById('lbl-sangre').innerText = sangre;
        document.getElementById('lbl-condicion').innerText = condicion;
        document.getElementById('lbl-alergias').innerText = alergias;
        document.getElementById('lbl-notas').innerText = notas;
        document.getElementById('btn-llamar').href = `tel:${tel}`;

        // Sistema de audio digital integrado (Beep de emergencia que suena en cualquier teléfono)
        function sonarAlarma() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Hace sonar 3 bips de alerta fuertes
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Tono de alerta agudo
                        
                        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                        
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.4);
                    }, i * 500);
                }

                // Intenta hacer vibrar el teléfono si es compatible
                if ("vibrate" in navigator) {
                    navigator.vibrate([300, 100, 300, 100, 500]);
                }
            } catch(e) {
                alert("Alerta de emergencia para: " + nombre + " - Tipo de sangre: " + sangre + " - Alergias: " + alergias);
            }
        }

        function obtenerUbicacionGPS() {
            const estadoGps = document.getElementById("estado-gps");
            if (!navigator.geolocation) {
                estadoGps.innerHTML = "❌ Tu navegador no soporta geolocalización.";
                return;
            }
            estadoGps.innerHTML = "⏳ Solicitando ubicación GPS...";
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    estadoGps.innerHTML = "✅ ¡Ubicación obtenida con éxito!";
                    window.open(`https://www.google.com/maps?q=${lat},${lon}`, '_blank');
                },
                (error) => {
                    estadoGps.innerHTML = "❌ No se pudo obtener el permiso de GPS.";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
