<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta de Emergencia - Identificación</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #eaeaea;
        }
        .header-alert {
            background: #d9534f;
            color: white;
            padding: 18px 20px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .audio-section {
            background: #fff3cd;
            padding: 15px 20px;
            border-bottom: 1px solid #ffeeba;
            text-align: center;
        }
        .audio-section p {
            font-size: 0.85rem;
            color: #856404;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .audio-section audio {
            width: 100%;
            height: 40px;
        }
        .content {
            padding: 20px;
        }
        .name-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        .info-group {
            margin-bottom: 14px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: #fafafa;
            padding: 10px 14px;
            border-radius: 10px;
            border-left: 4px solid #0275d8;
        }
        .info-group.alert-border {
            border-left-color: #d9534f;
        }
        .info-icon {
            font-size: 1.2rem;
            margin-top: 2px;
        }
        .info-content label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #777;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .info-content span {
            font-size: 0.95rem;
            color: #222;
            font-weight: 500;
        }
        .actions {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.85;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }
        .btn-call {
            background-color: #0275d8;
            color: white;
            box-shadow: 0 4px 12px rgba(2, 117, 216, 0.3);
        }
        .gps-status {
            text-align: center;
            font-size: 0.8rem;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header-alert">
        <span>⚠️ ALERTA DE EMERGENCIA</span>
    </div>

    <!-- Reproductor de audio institucional -->
    <div class="audio-section">
        <p>🔊 MENSAJE DE VOZ INSTITUCIONAL</p>
        <audio controls>
            <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
            Tu navegador no soporta el reproductor de audio.
        </audio>
    </div>

    <div class="content">
        <div class="name-title" id="nombre-usuario">Cargando datos...</div>

        <div class="info-group">
            <span class="info-icon">🩸</span>
            <div class="info-content">
                <label>Grupo Sanguíneo</label>
                <span id="txt-sangre">No especificado</span>
            </div>
        </div>

        <div class="info-group alert-border">
            <span class="info-icon">⚠️</span>
            <div class="info-content">
                <label>Condición Médica</label>
                <span id="txt-condicion">Ninguna registrada</span>
            </div>
        </div>

        <div class="info-group alert-border">
            <span class="info-icon">💊</span>
            <div class="info-content">
                <label>Alergias</label>
                <span id="txt-alergias">Ninguna registrada</span>
            </div>
        </div>

        <div class="info-group">
            <span class="info-icon">📝</span>
            <div class="info-content">
                <label>Información Importante</label>
                <span id="txt-notas">Mantener la calma, contactar a la familia.</span>
            </div>
        </div>

        <div class="actions">
            <a id="btn-wsp" href="#" class="btn btn-whatsapp">
                <span>📲 Enviar WhatsApp con Ubicación</span>
            </a>
            <a id="btn-tel" href="#" class="btn btn-call">
                <span>📞 Llamar por Teléfono Directamente</span>
            </a>
        </div>

        <div class="gps-status" id="status-gps">
            Obteniendo ubicación GPS de seguridad...
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    
    const tel = params.get('tel') || '999999999';
    const nombre = params.get('nombre') || 'Persona Protegida';
    const sangre = params.get('sangre') || 'No especificado';
    const condicion = params.get('condicion') || 'Ninguna';
    const alergias = params.get('alergias') || 'Ninguna';
    const notas = params.get('notas') || 'Sin notas adicionales.';

    document.getElementById('nombre-usuario').innerText = decodeURIComponent(nombre);
    document.getElementById('txt-sangre').innerText = decodeURIComponent(sangre);
    document.getElementById('txt-condicion').innerText = decodeURIComponent(condicion);
    document.getElementById('txt-alergias').innerText = decodeURIComponent(alergias);
    document.getElementById('txt-notas').innerText = decodeURIComponent(notas);

    document.getElementById('btn-tel').href = `tel:${tel}`;

    let ubicacionTexto = "Ubicación GPS no disponible.";
    
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                ubicacionTexto = `https://maps.google.com/?q=${lat},${lon}`;
                document.getElementById('status-gps').innerText = "📍 Ubicación GPS obtenida con éxito.";
                document.getElementById('status-gps').style.color = "#28a745";
                actualizarBotonWhatsApp(ubicacionTexto);
            },
            (error) => {
                document.getElementById('status-gps').innerText = "⚠️ No se pudo obtener GPS (Se enviará la alerta sin coordenadas).";
                document.getElementById('status-gps').style.color = "#d9534f";
                actualizarBotonWhatsApp("Ubicación denegada o no disponible.");
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    } else {
        actualizarBotonWhatsApp("GPS no soportado en este dispositivo.");
    }

    function actualizarBotonWhatsApp(linkUbicacion) {
        const mensaje = `🚨 ¡EMERGENCIA! He encontrado a ${decodeURIComponent(nombre)}. Por favor comuníquense conmigo urgente.\n\n📍 Ubicación actual aproximada: ${linkUbicacion}`;
        const urlWsp = `https://wa.me/51${tel}?text=${encodeURIComponent(mensaje)}`;
        document.getElementById('btn-wsp').href = urlWsp;
    }
</script>

</body>
</html>
