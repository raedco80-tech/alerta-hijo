<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta de Emergencia - Identificación</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f6f9; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: #ffffff; width: 100%; max-width: 420px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); overflow: hidden; border: 1px solid #eaeaea; }
        .header-alert { background: #d9534f; color: white; padding: 18px 20px; text-align: center; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .audio-section { background: #fff3cd; padding: 15px 20px; border-bottom: 1px solid #ffeeba; text-align: center; }
        .audio-section p { font-size: 0.85rem; color: #856404; font-weight: 600; margin-bottom: 10px; }
        .btn-voz { background-color: #f0ad4e; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 8px rgba(240, 173, 78, 0.3); }
        .content { padding: 20px; }
        .name-title { font-size: 1.4rem; font-weight: 700; color: #111; margin-bottom: 5px; text-align: center; }
        .tipo-badge { text-align: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #f0f0f0; }
        .tipo-badge span { background-color: #e2e8f0; color: #334155; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
        .info-group { margin-bottom: 14px; display: flex; align-items: flex-start; gap: 12px; background: #fafafa; padding: 10px 14px; border-radius: 10px; border-left: 4px solid #0275d8; }
        .info-group.alert-border { border-left-color: #d9534f; }
        .info-icon { font-size: 1.2rem; margin-top: 2px; }
        .info-content label { display: block; font-size: 0.75rem; text-transform: uppercase; color: #777; font-weight: 600; letter-spacing: 0.5px; }
        .info-content span { font-size: 0.95rem; color: #222; font-weight: 500; }
        .actions { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
        .btn-whatsapp { background-color: #25d366; color: white; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); }
        .btn-call { background-color: #0275d8; color: white; box-shadow: 0 4px 12px rgba(2, 117, 216, 0.3); }
        .gps-status { text-align: center; font-size: 0.8rem; color: #666; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-alert" id="header-bg">
        <span id="header-titulo">⚠️ ALERTA DE EMERGENCIA</span>
    </div>

    <div class="audio-section">
        <p>🔊 ASISTENTE DE VOZ INSTITUCIONAL</p>
        <button class="btn-voz" onclick="reproducirAlertaVoz()">
            <span>▶️ Escuchar Mensaje de Emergencia</span>
        </button>
    </div>

    <div class="content">
        <div class="name-title" id="nombre-usuario">Cargando datos...</div>
        <div class="tipo-badge">
            <span id="txt-tipo-badge">Perfil</span>
        </div>

        <div class="info-group" id="grupo-sangre">
            <span class="info-icon" id="icon-sangre">🩸</span>
            <div class="info-content">
                <label id="label-sangre">Grupo Sanguíneo</label>
                <span id="txt-sangre">No especificado</span>
            </div>
        </div>

        <div class="info-group alert-border">
            <span class="info-icon" id="icon-condicion">⚠️</span>
            <div class="info-content">
                <label id="label-condicion">Condición Médica</label>
                <span id="txt-condicion">Ninguna registrada</span>
            </div>
        </div>

        <div class="info-group alert-border">
            <span class="info-icon">💊</span>
            <div class="info-content">
                <label id="label-alergias">Alergias / Cuidados</label>
                <span id="txt-alergias">Ninguna registrada</span>
            </div>
        </div>

        <div class="info-group">
            <span class="info-icon">📝</span>
            <div class="info-content">
                <label>Información Importante</label>
                <span id="txt-notas">Mantener la calma, contactar a la familia.</span>
            </div>
        </div>

        <div class="actions">
            <a id="btn-wsp" href="#" class="btn btn-whatsapp">
                <span>📲 Enviar WhatsApp con Ubicación</span>
            </a>
            <a id="btn-tel" href="#" class="btn btn-call">
                <span>📞 Llamar por Teléfono Directamente</span>
            </a>
        </div>

        <div class="gps-status" id="status-gps">Buscando satélites GPS de precisión...</div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    
    const tipo = decodeURIComponent(params.get('tipo') || '').toLowerCase();
    const tel = params.get('tel') || '';
    const nombre = decodeURIComponent(params.get('nombre') || 'Persona Protegida');
    const sangre = decodeURIComponent(params.get('sangre') || '');
    const condicion = decodeURIComponent(params.get('condicion') || '');
    const alergias = decodeURIComponent(params.get('alergias') || '');
    const notas = decodeURIComponent(params.get('notas') || '');

    // Aplicar estilos según el tipo detectado
    if (tipo.includes('mascota') || tipo.includes('perro') || tipo.includes('gato')) {
        document.getElementById('header-bg').style.background = '#e67e22';
        document.getElementById('header-titulo').innerText = '🐾 ¡MASCOTA PERDIDA / EXTRAVIADA!';
        document.getElementById('txt-tipo-badge').innerText = '🐶 Perfil: Mascota';
        document.getElementById('txt-tipo-badge').style.background = '#fef3c7';
        document.getElementById('txt-tipo-badge').style.color = '#d97706';
        document.getElementById('label-sangre').innerText = 'Raza / Especie';
        document.getElementById('icon-sangre').innerText = '🐕';
        document.getElementById('label-condicion').innerText = 'Temperamento / Comportamiento';
        document.getElementById('label-alergias').innerText = 'Cuidados Especiales';
    } else if (tipo.includes('adulto') || tipo.includes('mayor')) {
        document.getElementById('header-bg').style.background = '#2c3e50';
        document.getElementById('header-titulo').innerText = '👴 ALERTA DE ADULTO MAYOR';
        document.getElementById('txt-tipo-badge').innerText = '👴 Perfil: Adulto Mayor';
        document.getElementById('txt-tipo-badge').style.background = '#e2e8f0';
        document.getElementById('txt-tipo-badge').style.color = '#1e293b';
        document.getElementById('label-sangre').innerText = 'Grupo Sanguíneo';
        document.getElementById('icon-sangre').innerText = '🩸';
        document.getElementById('label-condicion').innerText = 'Condición / Memoria / Salud';
        document.getElementById('label-alergias').innerText = 'Medicamentos / Alergias';
    } else {
        document.getElementById('header-bg').style.background = '#d9534f';
        document.getElementById('header-titulo').innerText = '⚠️ ALERTA DE EMERGENCIA - MENOR';
        document.getElementById('txt-tipo-badge').innerText = '👶 Perfil: Menor / Niño';
        document.getElementById('label-sangre').innerText = 'Grupo Sanguíneo';
        document.getElementById('icon-sangre').innerText = '🩸';
        document.getElementById('label-condicion').innerText = 'Condición Médica';
        document.getElementById('label-alergias').innerText = 'Alergias';
    }

    document.getElementById('nombre-usuario').innerText = nombre;
    document.getElementById('txt-sangre').innerText = sangre !== '' ? sangre : 'No especificado';
    document.getElementById('txt-condicion').innerText = condicion !== '' ? condicion : 'Ninguna registrada';
    document.getElementById('txt-alergias').innerText = alergias !== '' ? alergias : 'Ninguna registrada';
    document.getElementById('txt-notas').innerText = notas !== '' ? notas : 'Sin notas adicionales.';

    const telLimpio = tel.replace(/\D/g, '');
    document.getElementById('btn-tel').href = `tel:${telLimpio}`;

    function reproducirAlertaVoz() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let textoMensaje = `Atención. Alerta de emergencia para ${nombre}. Condición: ${condicion || 'ninguna'}. Alergias: ${alergias || 'ninguna'}. Notas: ${notas || 'ninguna'}. Por favor comuníquese de inmediato con la familia.`;
            const utterance = new SpeechSynthesisUtterance(textoMensaje);
            utterance.lang = 'es-ES';
            window.speechSynthesis.speak(utterance);
        }
    }

    let ubicacionTexto = "Ubicación no disponible.";
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                ubicacionTexto = `https://www.google.com/maps/search/?api=1&query=${pos.coords.latitude},${pos.coords.longitude}`;
                document.getElementById('status-gps').innerText = "📍 ¡Ubicación GPS exacta fijada!";
                document.getElementById('status-gps').style.color = "#28a745";
                actualizarBotonWhatsApp(ubicacionTexto);
            },
            (err) => { actualizarBotonWhatsApp("Ubicación no disponible."); },
            { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
        );
    } else {
        actualizarBotonWhatsApp("GPS no soportado.");
    }

    function actualizarBotonWhatsApp(linkUbicacion) {
        let mensaje = `🚨 ¡EMERGENCIA! He encontrado a ${nombre}. Por favor comuníquense conmigo urgente.\n\n📍 Ubicación:\n${linkUbicacion}`;
        const urlWsp = `https://wa.me/${tel.replace(/\D/g, '')}?text=${encodeURIComponent(mensaje)}`;
        document.getElementById('btn-wsp').href = urlWsp;
    }
</script>
</body>
</html>
