<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta de Emergencia Médica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffebee;
            color: #333;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(217,83,79,0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 3px solid #d9534f;
        }
        h2 { margin-top: 0; color: #d9534f; font-size: 24px; }
        .data-box {
            text-align: left;
            background: #fff5f5;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 6px solid #d9534f;
        }
        .data-box p { margin: 10px 0; font-size: 16px; }
        .btn-principal {
            display: block;
            background-color: #d9534f;
            color: white;
            padding: 15px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
        }
        .btn-voz { background-color: #ffc107; color: #333; }
        .btn-llamada { background-color: #28a745; }
        .btn-gps { background-color: #007bff; }
        #estado-gps { margin-top: 10px; font-size: 14px; color: #555; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚠️ ALERTA DE EMERGENCIA</h2>
        <p>Información médica y de contacto vital:</p>
        
        <div class="data-box">
            <p><strong>Nombre:</strong> <span id="lbl-nombre">Cargando...</span></p>
            <p><strong>Tipo:</strong> <span id="lbl-tipo">-</span></p>
            <p><strong>Tipo de Sangre:</strong> <span id="lbl-sangre">-</span></p>
            <p><strong>Condición:</strong> <span id="lbl-condicion">-</span></p>
            <p><strong>Alergias:</strong> <span id="lbl-alergias">-</span></p>
            <p><strong>Notas:</strong> <span id="lbl-notas">-</span></p>
        </div>

        <!-- Botón de voz obligatorio -->
        <button class="btn-principal btn-voz" onclick="reproducirVoz()">🔊 ESCUCHAR ALERTA EN VOZ</button>

        <!-- Botón de llamada rápida -->
        <a id="btn-llamar" href="#" class="btn-principal btn-llamada">📞 LLAMAR A CONTACTO URGENTE</a>

        <!-- Botón de Ubicación GPS Exacta -->
        <button class="btn-principal btn-gps" onclick="obtenerUbicacionGPS()">📍 OBTENER UBICACIÓN GPS EXACTA</button>
        <p id="estado-gps"></p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        const nombre = params.get('nombre') || 'No especificado';
        const tipo = params.get('tipo') || 'Persona';
        const tel = params.get('tel') || '#';
        const sangre = params.get('sangre') || 'No especificado';
        const condicion = params.get('condicion') || 'Ninguna';
        const alergias = params.get('alergias') || 'Ninguna';
        const notas = params.get('notas') || 'Ninguna';

        document.getElementById('lbl-nombre').innerText = nombre;
        document.getElementById('lbl-tipo').innerText = tipo;
        document.getElementById('lbl-sangre').innerText = sangre;
        document.getElementById('lbl-condicion').innerText = condicion;
        document.getElementById('lbl-alergias').innerText = alergias;
        document.getElementById('lbl-notas').innerText = notas;
        document.getElementById('btn-llamar').href = `tel:${tel}`;

        function reproducirVoz() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const textoMensaje = `Atención. Alerta de emergencia médica para ${tipo}, de nombre ${nombre}. Tipo de sangre ${sangre}. Condición médica: ${condicion}. Alergias: ${alergias}. Por favor comunicarse urgentemente al teléfono de contacto.`;
                const mensajeVoz = new SpeechSynthesisUtterance(textoMensaje);
                mensajeVoz.lang = 'es-ES';
                mensajeVoz.rate = 0.9;
                window.speechSynthesis.speak(mensajeVoz);
            } else {
                alert("Tu dispositivo no soporta la función de voz.");
            }
        }

        function obtenerUbicacionGPS() {
            const estadoGps = document.getElementById("estado-gps");
            if (!navigator.geolocation) {
                estadoGps.innerHTML = "❌ Tu navegador no soporta geolocalización.";
                return;
            }
            estadoGps.innerHTML = "⏳ Solicitando ubicación GPS exacta...";
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    estadoGps.innerHTML = "✅ ¡Ubicación obtenida con éxito!";
                    window.open(`https://www.google.com/maps?q=${lat},${lon}`, '_blank');
                },
                (error) => {
                    estadoGps.innerHTML = "❌ Debes permitir el acceso a la ubicación.";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
