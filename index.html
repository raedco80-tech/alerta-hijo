<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta de Emergencia</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 20px; color: #333; }
        .container { max-width: 400px; background: white; margin: 40px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #d9534f; }
        p { font-size: 18px; margin: 20px 0; }
        .btn { display: inline-block; background-color: #25d366; color: white; padding: 15px 25px; font-size: 18px; font-weight: bold; text-decoration: none; border-radius: 8px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn:hover { background-color: #1ebe5d; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚠️ Alerta de Emergencia</h2>
        <p id="mensajeInfo">Cargando datos...</p>
        <a id="btnAlerta" href="#" class="btn" style="display:none;">📲 Llamar / Escribir por WhatsApp</a>
    </div>

    <script>
        // Leer los datos que vienen en el enlace (tel y nombre)
        const urlParams = new URLSearchParams(window.location.search);
        const telefono = urlParams.get('tel');
        const nombre = urlParams.get('nombre');

        const mensajeInfo = document.getElementById('mensajeInfo');
        const btnAlerta = document.getElementById('btnAlerta');

        if (telefono && nombre) {
            const nombreDecodificado = decodeURIComponent(nombre);
            mensajeInfo.innerHTML = "Si has encontrado a <b>" + nombreDecodificado + "</b>, por favor haz clic en el botón para avisar a su familia de inmediato:";
            
            // Texto automático para WhatsApp
            const textoMensaje = "¡Hola! He encontrado a " + nombreDecodificado + " y necesita asistencia urgente.";
            
            // Enlace directo a WhatsApp con el número dinámico de la hoja
            btnAlerta.href = "https://wa.me/" + telefono + "?text=" + encodeURIComponent(textoMensaje);
            btnAlerta.style.display = "inline-block";
        } else {
            mensajeInfo.innerText = "Error: No se encontraron los datos de la alerta en este código QR.";
        }
    </script>
</body>
</html>
